<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>桃花之源</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='10.5' r='6' fill='%23F2789F'/%3E%3Ccircle cx='9' cy='17' r='5.6' fill='%23FFB3C6'/%3E%3Ccircle cx='23' cy='17' r='5.6' fill='%23FFB3C6'/%3E%3Ccircle cx='12' cy='24' r='5.2' fill='%23F2789F'/%3E%3Ccircle cx='20' cy='24' r='5.2' fill='%23F2789F'/%3E%3Ccircle cx='16' cy='17.5' r='3.4' fill='%23FFF7F4'/%3E%3C/svg%3E">
  <meta name="description" content="桃花之源 —— 落笔即生花，随手记下此刻心绪的轻盈角落。">
  <meta name="theme-color" content="#FFF7F4">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- 背景装饰：桃花光晕与飘落花瓣 -->
  <div class="scene" aria-hidden="true">
    <span class="scene__glow scene__glow--a"></span>
    <span class="scene__glow scene__glow--b"></span>
    <div class="petals">
      <i class="petal"></i><i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    </div>
  </div>

  <div class="app">
    <header class="brand">
      <div class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="15" r="8.5" fill="url(#p1)" opacity=".92"/>
          <circle cx="15" cy="23" r="8.5" fill="url(#p2)" opacity=".85"/>
          <circle cx="33" cy="23" r="8.5" fill="url(#p2)" opacity=".85"/>
          <circle cx="19" cy="33" r="8" fill="url(#p1)" opacity=".8"/>
          <circle cx="29" cy="33" r="8" fill="url(#p1)" opacity=".8"/>
          <circle cx="24" cy="25" r="4.6" fill="#FFF7F4"/>
          <circle cx="24" cy="25" r="2.2" fill="#F0A9B8"/>
          <defs>
            <linearGradient id="p1" x1="16" y1="8" x2="34" y2="38" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F2789F"/><stop offset="1" stop-color="#E8657F"/>
            </linearGradient>
            <linearGradient id="p2" x1="8" y1="16" x2="30" y2="34" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFB3C6"/><stop offset="1" stop-color="#F2789F"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand__text">
        <h1 class="brand__title">桃花之源</h1>
        <p class="brand__sub">落笔即生花，随手记下此刻心绪</p>
      </div>
      <span class="brand__line" aria-hidden="true"></span>
    </header>

    <main class="main">
      <!-- 发布区 -->
      <section class="composer" aria-label="发布">
        <form id="composer-form" class="composer__form" novalidate>
          <label class="sr-only" for="composer-input">写下此刻的想法</label>
          <textarea
            id="composer-input"
            class="composer__input"
            name="content"
            rows="3"
            maxlength="280"
            placeholder="此刻想到了什么？写下来，它会留在这里。"
            autocomplete="off"
          ></textarea>

          <div class="composer__bar">
            <span class="composer__count" id="composer-count" aria-live="off">
              <b id="count-num">0</b><span class="composer__count-total">/280</span>
            </span>
            <button class="btn-publish" id="submit-btn" type="submit" disabled>
              <span class="btn-publish__text">发布</span>
              <svg class="btn-publish__icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                <path d="M2.5 10.5 17 3.5l-4.6 14-2.6-5.6-5.3-1.4Z" fill="currentColor" opacity=".95"/>
              </svg>
            </button>
          </div>
        </form>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <!-- 时间线 -->
      <section class="timeline" aria-label="时间线">
        <div class="timeline__head">
          <h2 class="timeline__title">花开有时</h2>
          <span class="timeline__total" id="post-total">共 0 条</span>
        </div>

        <ul class="timeline__list" id="timeline-list"></ul>

        <div class="empty" id="empty-state">
          <div class="empty__art" aria-hidden="true">
            <svg viewBox="0 0 120 90" width="112" height="84" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M60 78V42" stroke="#F0A9B8" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M60 62c-9 0-16-5-18-12 9-1 16 3 18 12Z" fill="#FFB3C6" opacity=".75"/>
              <path d="M60 54c8-1 14-6 15-13-8 0-14 5-15 13Z" fill="#F2789F" opacity=".55"/>
              <g opacity=".9">
                <circle cx="60" cy="26" r="8" fill="#FFB3C6"/>
                <circle cx="50" cy="33" r="7.4" fill="#F7A2BA"/>
                <circle cx="70" cy="33" r="7.4" fill="#F7A2BA"/>
                <circle cx="55" cy="41" r="6.6" fill="#FFB3C6"/>
                <circle cx="65" cy="41" r="6.6" fill="#FFB3C6"/>
                <circle cx="60" cy="33" r="3.4" fill="#FFF7F4"/>
              </g>
              <circle cx="24" cy="72" r="2" fill="#F0A9B8"/>
              <circle cx="98" cy="60" r="2.4" fill="#FFB3C6"/>
              <circle cx="30" cy="50" r="1.6" fill="#FFB3C6"/>
            </svg>
          </div>
          <p class="empty__title">这里还是一片空地</p>
          <p class="empty__hint">写下第一句心绪，让桃花为你开一次</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>桃花之源 · 记录只留在本机浏览器，不上传任何服务器</p>
    </footer>
  </div>
</body>
</html>
